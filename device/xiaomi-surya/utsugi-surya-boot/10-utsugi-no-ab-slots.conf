[Unit]
# The surya has no A/B slots: its GPT carries one "boot" partition and qbootctl
# answers "No slots found, is this an A/B device?" and exits 1. Measured on
# 2026-09-11: 76 partition labels, none ending in _a or _b.
#
# A failed unit is not free. `systemctl is-system-running` reports degraded on
# every boot, so the one signal that says "something did not start" is spent on
# something that can never start here, and a real failure hides behind it.
#
# The condition is the partition an A/B device would have, so the unit runs
# normally on hardware where it makes sense and is skipped -- not failed -- here.
ConditionPathExists=/dev/disk/by-partlabel/boot_a
