# Kernel command line for the POCO X3 NFC.
#
# boot-deploy builds the boot entry from /usr/lib/kernel-cmdline.d/*.conf when
# the device package sets no deviceinfo_kernel_cmdline. Before this file the
# values were sed'ed back into /boot/loader/entries/pmos.conf after every kernel
# install, because boot-deploy rewrites that file and wiped them each time.

# Contiguous memory for the cameras. Without it the ISP cannot allocate its
# buffers and capture fails.
cma=512M

# With bit errors in the DDR a compressed ramoops dump is unrecoverable;
# uncompressed it still reads, which is the whole point of keeping one.
pstore.compress=none

# PSCI v1.1 SYSTEM_RESET2 instead of SYSTEM_RESET. The cold reset leaves the
# phone POWERED OFF about one time in four.
reboot=warm

# A ring big enough to hold what the freeze dump puts into it.
#
# When freeze-watchdog trips it fires SysRq 't' and 'w', which is hundreds of
# task stacks -- and then it reads /dev/kmsg back to save them. With the default
# ring that dump overruns itself before it can be read.
#
# Measured on 2026-09-12: a freeze that lasted fifteen hours had its ring
# completely overwritten by systemd session lines. systemd falls back to logging
# on /dev/kmsg when journald dies, journald dies because it cannot write to a
# frozen disk, and every ssh login then costs several lines. By the time the
# phone was looked at, the UFS error that started it was long gone.
#
# 4 MiB of 5.7 GiB, and it only has to survive one freeze to pay for itself.
log_buf_len=4M
