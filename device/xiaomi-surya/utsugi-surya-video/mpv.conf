# Decode video on the Venus block of the SM7150 (utsugi-surya-video).
#
# ffmpeg reaches it through V4L2 mem2mem (/dev/videoN "qcom-venus-decoder"),
# and mpv 0.41 only has the copy variant for that path. If the decoder is not
# there or refuses the stream, mpv falls back to software on its own; this only
# changes the default.
#
# Only H.264 and HEVC, on purpose. VP9 decodes bit-exact from libvpx encodes
# (1080p and 4K, with and without alt-ref) but comes out corrupt from
# YouTube's encoder -- keyframes fine, every inter frame wrong, "driver decode
# error" on the capture queue (measured 2026-09-19, 1080p and 4K). Until that is
# understood VP9 stays in software, where 1080p is fine and 4K is not.
#
# Measured on the POCO X3 NFC, 1080p30 H.264: 1-5 % of one core with this,
# most of a core without it.
hwdec=v4l2m2m-copy
hwdec-codecs=h264,hevc
