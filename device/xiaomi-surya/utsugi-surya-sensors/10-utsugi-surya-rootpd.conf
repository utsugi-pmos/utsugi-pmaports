# The same race as sensorspd, and the same fix: see the long note in
# hexagonrpcd-adsp-sensorspd.service.d/10-utsugi-surya.conf.
#
# rootpd won the race on 2026-09-10 and started, which is precisely why it is
# fixed here too: whether the ADSP gets its root domain served must not depend on
# the order two units happen to be checked in.
[Unit]
ConditionPathExists=
ConditionPathExists=!/dev/fastrpc-sdsp
After=dev-fastrpc\x2dadsp.device
BindsTo=dev-fastrpc\x2dadsp.device
