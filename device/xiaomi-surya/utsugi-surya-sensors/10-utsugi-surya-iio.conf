[Unit]
# If the daemon was skipped by the guard it finishes at once, so this blocks
# nobody.
After=hexagonrpcd-adsp-sensorspd.service
Wants=utsugi-surya-sensors-seed.service
After=utsugi-surya-sensors-seed.service

[Service]
# 3 s: ten times the margin measured to be enough, and a tenth of what the phone
# takes to turn the screen on.
ExecStartPre=/bin/sleep 3
