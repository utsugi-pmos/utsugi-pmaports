# hexagonrpcd serves from /usr/share/qcom by default, and here it must serve the
# WRITABLE copy instead (see sensors-seed). Upstream sets -R in /etc/conf.d,
# which is OpenRC; on systemd it takes this drop-in.

[Unit]
# THE RACE THAT LEFT THE PHONE WITHOUT SENSORS, AND THEN WITHOUT A FILESYSTEM.
#
# Upstream guards the unit with ConditionPathExists=/dev/fastrpc-adsp. That node
# is created when the ADSP probes, which happens in PARALLEL with
# multi-user.target: on 2026-09-10 the condition was evaluated 4 s into the boot,
# the node did not exist yet, and systemd skipped the unit -- for good, because a
# failed condition is not retried. Its sibling rootpd won the same race and
# started, which is why the failure looks random from one boot to the next.
#
# With no sensorspd nobody serves the sensor registry, so hours later the sensor
# domain died, took the ADSP with it (they share it with audio), and the ADSP
# recovery deadlocked: rproc_recovery_wq stuck in D, and behind it the encrypted
# root's I/O -- 51 requests parked in dm-0, load 114, black screen, seven hours.
#
# So the condition is dropped and the unit is tied to the DEVICE instead. The
# node is already TAG+="systemd", so dev-fastrpc\x2dadsp.device exists; After=
# waits for it, BindsTo= stops the daemon if the ADSP goes away, and the udev
# rule pulls the unit back in when the node returns. That last part is the
# recovery this never had.
ConditionPathExists=
ConditionPathExists=!/dev/fastrpc-sdsp
After=dev-fastrpc\x2dadsp.device
BindsTo=dev-fastrpc\x2dadsp.device

[Service]
# If the binary does not carry the four patches this exits non-zero and systemd
# skips the unit instead of starting a daemon that cannot serve the registry.
ExecCondition=/usr/libexec/utsugi-surya/hexagonrpcd-is-patched
ExecStart=
ExecStart=/usr/bin/hexagonrpcd -f /dev/fastrpc-adsp -d adsp -s -R /var/lib/hexagonrpcd/surya
