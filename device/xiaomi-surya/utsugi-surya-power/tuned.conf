# TuneD profile behind the "power-saver" PPD profile on this phone.
#
# WHY THIS FILE EXISTS
# --------------------
# The phone already runs tuned-ppd, which serves net.hadess.PowerProfiles, and
# PowerDevil already drives it. But the stock "powersave" profile that PPD maps
# to is effectively x86-only, so asking for power-saver changed NOTHING here.
# Measured, before this profile existed:
#
#     ppd=balanced     gov0=schedutil max0=1804800  gov6=schedutil max6=2304000
#     ppd=power-saver  gov0=schedutil max0=1804800  gov6=schedutil max6=2304000
#
# Every lever the stock profile pulls is absent on this SoC:
#
#     governor=schedutil|conservative|powersave   picks the FIRST available,
#                                                 and schedutil already is ->
#                                                 no change at all
#     energy_perf_bias / energy_performance_preference    x86 only
#     [acpi] platform_profile     no /sys/firmware/acpi here
#     [video] radeon_powersave, panel_power_savings       AMD/Intel only
#
# So the tile would have been a button that reports a state and saves nothing.
# What is left that this hardware DOES have is the frequency ceilings, which
# the [sysfs] plugin can reach. Those are set below.
#
# The include keeps the parts of the stock profile that do work here -- boost=0
# and the vm/sysctl writeback tuning -- so this only ADDS the missing levers.
[main]
summary=Low power consumption, using the levers this SoC actually has
include=powersave

# schedutil STAYS, deliberately, even though "conservative" looks like the more
# aggressive choice and was the first thing tried.
#
# This kernel has CONFIG_ENERGY_MODEL=y, an energy model registered for both
# clusters (/sys/kernel/debug/energy_model/cpu0 and cpu6) and asymmetric
# capacities (cpu0=382, cpu6=1024), so Energy Aware Scheduling is live. EAS
# only runs under schedutil: the kernel rebuilds the energy-aware scheduling
# domains when sugov starts and tears them down when it stops. Measured on this
# phone by flipping the governor and reading back:
#
#     schedutil     /sys/kernel/debug/sched/energy_aware_enabled = 1
#     conservative  the file is GONE  -> EAS off
#     schedutil     = 1 again
#
# With EAS off the scheduler stops placing light tasks on the little cluster on
# energy grounds, which on a 382/1024 big.LITTLE can burn MORE power than it
# saves -- the opposite of the point. Capping the clock is the safe lever; the
# governor is not.
[cpu]
governor=schedutil

# The ceilings. Values are taken from scaling_available_frequencies, NOT
# rounded: cpufreq snaps a write to the nearest step, so writing an invented
# number silently lands somewhere else. 1324800 is the one step both clusters
# share, so they end up capped at the same clock.
#
#     policy0 (6 little)   1804800 -> 1324800
#     policy6 (2 big)      2304000 -> 1324800
#     GPU                800000000 -> 430000000
#
# TuneD records the previous value of every sysfs path it writes and puts it
# back when the profile is deactivated; verified here by switching to this
# profile and back to balanced, with all six values returning exactly.
[sysfs]
/sys/devices/system/cpu/cpufreq/policy0/scaling_max_freq=1324800
/sys/devices/system/cpu/cpufreq/policy6/scaling_max_freq=1324800
/sys/class/devfreq/5000000.gpu/max_freq=430000000
