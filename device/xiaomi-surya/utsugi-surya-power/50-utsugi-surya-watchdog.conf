# Arms the SoC watchdog (17c10000.watchdog, qcom_wdt) from systemd.
#
# WHY
# ---
# When the surya hangs while booting, sometimes something resets it after
# ~24 s and it tries again, and sometimes nobody resets it and it stays down
# until a person presses the button for 10-12 s. This makes that rescue
# something fixed: PID 1 opens /dev/watchdog and feeds it; if the system stops
# responding, the hardware resets on its own.
#
# It does not fix the cause of the hang. What it does is remove the need for a
# person, which is what today makes the device unusable as a daily phone.
#
# And as a bonus: a watchdog reset is a WARM reset, so the ramoops memory
# survives and the next boot can bring the trace.
#
# RuntimeWatchdogSec  NOTE: the hardware maximum is 30 s. With 60 systemd
#                     fails with "Failed to set watchdog hardware timeout to
#                     1min: Invalid argument" and ARMS NOTHING. Measured on
#                     2026-08-15: the watchdog never came to exist.
# RebootWatchdogSec   if the POWER-OFF hangs, it resets instead of waiting the
#                     10 minutes systemd ships from the factory. 120 and not 30
#                     since 2026-09-05: the real power-off of this phone is
#                     done by the PMIC watchdog (kernel/0111), which bites 60 s
#                     after Linux finishes; with 30 here the SoC one reset
#                     earlier and the power-off became a reboot again.
#
# Goes in /etc/systemd/system.conf.d/watchdog.conf

[Manager]
RuntimeWatchdogSec=20
RebootWatchdogSec=120
