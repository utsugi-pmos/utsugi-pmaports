# The journal on this phone grows faster than normal ON PURPOSE: the black box
# raises the console level from 4 to 7 and forces a flush to disk every
# second, so the next hang leaves a trail down to the last instant. The price
# is volume, and without a limit that price has no ceiling.
#
# Without this systemd uses 10% of the disk: on this phone, 10 GB. Measured on
# 2026-09-04, with the instrument in place: 828 MB accumulated.
#
# 512 MB is more than enough for what is being investigated. It is several days
# of boots at level 7, and a hang being chased is analyzed in hours, not
# months. MaxRetentionSec closes the other door: a small but eternal journal is
# no use either.
[Journal]
SystemMaxUse=512M
SystemKeepFree=2G
MaxRetentionSec=2week
