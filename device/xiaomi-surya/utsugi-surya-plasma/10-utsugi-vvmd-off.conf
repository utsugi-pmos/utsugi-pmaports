[Unit]
# vvmd is the visual voicemail daemon. On this phone it starts, cannot get the
# D-Bus service it needs and exits straight away:
#
#     vvmd[1753]: VVMD version 1.1, git version: 1.1
#     vvmd[1753]: Lost Dbus Connection! Exiting....
#
# Visual voicemail does not work here anyway -- the modem never announces the
# service (see VOICE-01) -- so the unit is skipped instead of failing on every
# boot. Create the file below and it runs again, which is how you would try
# visual voicemail if a carrier ever offered it:
#
#     sudo mkdir -p /etc/utsugi-surya && sudo touch /etc/utsugi-surya/visual-voicemail
ConditionPathExists=/etc/utsugi-surya/visual-voicemail
