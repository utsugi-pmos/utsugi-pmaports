# Panel margins for the POCO X3 NFC.
#
# Plasma Mobile leaves the status bar smallSpacing * 3 of margin, 12 logical px,
# and on this phone the screen's curve has already taken several of them at that
# height: the clock on the left and the battery on the right ended up half
# covered. The bottom bar has the same problem at its two corner buttons.
#
# This is the mechanism made for exactly that: the shell reads a device preset
# and adds the margins to its own. The OnePlus 6 and the Fairphone 5 have one
# for the same reason; the surya had none and fell back to zero.
#
# The units are physical pixels: the shell divides them by the screen scale.
[Device]
name=Xiaomi POCO X3 NFC

[Panels]
leftPadding=40
rightPadding=40
