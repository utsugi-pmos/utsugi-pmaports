[Service]
# The XDG autostart entry runs 'start-pulseaudio-x11', and on this phone that
# script always ends in failure: DISPLAY is set (Xwayland is there) so it tries
# to load module-x11-publish, and the module cannot initialise on a session that
# has no real X server. The script runs under 'set -e', so it exits 1.
#
# What it does BEFORE failing is what matters: its first pactl call autospawns
# PulseAudio, which is how the daemon comes up here. So the unit must keep
# running -- what has to stop is it reporting a failure for the one part of its
# job that cannot work on Wayland.
#
# Measured on 2026-09-11: with the unit "failed", `pactl info` answers and sound
# works. What the failure costs is the signal: `systemctl --user --failed` had
# two permanent entries, so a real failure had nowhere to show.
SuccessExitStatus=1
