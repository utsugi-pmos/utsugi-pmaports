# The stock unit sets --loc-set-engine-lock=mt, which this modem firmware
# rejects: every mobile-initiated LOC session then fails with QMI error 46
# (GeneralError), so ModemManager and GeoClue can never start the GPS engine.
# Measured on surya: none/mi start the engine, mt/all always fail -- the
# firmware treats the value as "which type is allowed", inverting mi and mt
# relative to the QMI spec. Use mi: it allows our own fixes and keeps the
# privacy intent behind the stock value.
#
# gnss-ready goes LAST and in this same file: it retries the unlock until the
# modem really answers and then turns the satellite sources on. Splitting these
# into two drop-ins silently dropped it -- see the comment above.
[Service]
Type=oneshot
RemainAfterExit=yes
ExecStart=
ExecStart=qmicli -d qrtr://0 --loc-set-engine-lock=mi
ExecStart=qmicli -d qrtr://0 --loc-set-nmea-types=all
ExecStart=/usr/libexec/utsugi-surya/gnss-ready
TimeoutStartSec=180
