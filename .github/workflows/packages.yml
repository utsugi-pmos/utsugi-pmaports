name: packages

# Build what changed and republish the repository.
#
# Native aarch64 runners: free for public repositories, and they remove the
# whole cross-compilation problem (crossdirect losing liblto_plugin.so) because
# nothing is cross-compiled any more.
on:
  push:
    branches: [main]
    paths: ['main/**', 'device/**', 'upstream.lock', 'scripts/**', 'site/**']
  workflow_dispatch:
    inputs:
      packages:
        description: 'space separated aports, or "all"'
        default: all

concurrency:
  group: publish            # publish rewrites the whole gh-pages branch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    outputs:
      apks: ${{ steps.check.outputs.has }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/pmbootstrap
        with:
          abuild-privkey: ${{ secrets.ABUILD_PRIVKEY }}
      - name: build
        run: |
          # --force here, and it is not laziness: the mirror this runner reads
          # already carries whatever was published from a laptop, so pmbootstrap
          # would call every package "up to date" and build nothing, and the
          # stale-artifact guard would then fail the job. CI rebuilds what the
          # commit touched, full stop.
          if [ '${{ github.event_name }}' = workflow_dispatch ]; then
            case '${{ inputs.packages }}' in
              all) scripts/build --force --all ;;
              *)   scripts/build --force ${{ inputs.packages }} ;;
            esac
          else
            scripts/build --force --changed '${{ github.event.before }}'
          fi
      # pmbootstrap keeps the real error in its own log and prints only
      # "Couldn't build ...". Without this, a CI failure says which package
      # broke and refuses to say why -- which is exactly what happened to
      # r254 on 2026-09-10.
      - name: pmbootstrap log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pmbootstrap-log
          path: ~/.local/var/pmbootstrap-utsugi/log.txt
          if-no-files-found: warn
          retention-days: 14

      # Did the build produce any apk? A commit touching only site/ or scripts/
      # builds none, and that is not a failure -- publish still runs to re-render
      # the pages. This flag lets publish skip the download instead of letting it
      # fail, which kept the run clean but flagged a red 'artifact not found'.
      - name: any apks?
        id: check
        run: |
          if ls ~/.local/var/pmbootstrap-utsugi/packages/edge/aarch64/*.apk >/dev/null 2>&1; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: ~/.local/var/pmbootstrap-utsugi/packages/edge/aarch64/*.apk
          retention-days: 14
          if-no-files-found: ignore

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        # Only when the build produced apks. A site- or scripts-only commit
        # builds none, and publish then carries every package from the live
        # site; skipping the download keeps the run green with no red annotation.
        if: needs.build.outputs.apks == 'true'
        with: { name: apks, path: apks }
      - run: mkdir -p apks
      - name: sign and push
        env:
          ABUILD_PRIVKEY: ${{ secrets.ABUILD_PRIVKEY }}
          # scripts/publish asks 'gh' for the latest -surya release to name the
          # image in the instructions, and refuses to publish if it cannot --
          # a hardcoded name would make the download button a 404. The CLI is
          # installed on the runner but not logged in, so it needs the token.
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ~/.local/var/pmbootstrap-utsugi/config_abuild
          KEY=$(basename keys/*.rsa.pub .pub)
          printf '%s' "$ABUILD_PRIVKEY" > ~/.local/var/pmbootstrap-utsugi/config_abuild/"$KEY"
          chmod 600 ~/.local/var/pmbootstrap-utsugi/config_abuild/"$KEY"
          git config --global user.email cidwel@gmail.com
          git config --global user.name 'Dr. Utsugi'
          GH_REMOTE="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            scripts/publish --from apks --push
