# The patched task switcher lives in a data directory of our own, placed AHEAD of
# /usr/share so KPackage finds it first. Patching the file in place would mean
# owning a file of plasma-mobile's, and after a Plasma upgrade our old Task.qml
# would sit next to new siblings, which is the mixed-version breakage this
# avoids.
XDG_DATA_DIRS=/usr/share/keepalive/xdg-data:${XDG_DATA_DIRS:-/usr/local/share:/usr/share}
