# SPDX-License-Identifier: CC0-1.0
#
# libcamera tuning for the surya's rear IMX682.
# Goes in /usr/share/libcamera/ipa/simple/imx682.yaml
#
# WITHOUT THIS libcamera falls back to uncalibrated.yaml, which neither
# subtracts the pedestal nor corrects colour: the image comes out washed out,
# with grey blacks and flat colours. That is exactly what the first good capture
# looked like.
#
# THE BLACK LEVEL, measured on this sensor rather than copied
# ----------------------------------------------------------
# With the lens covered -- or looking into the dark -- captures give a stable
# floor:
#
#     gain=0      minimum 58, median 68 in ten bits
#     gain=978    the floor does not move; what rises is the signal
#
# So the classic pedestal of 64 in ten bits. libcamera counts it over 16 bits,
# hence 64 << 6 = 4096.
#
# THE COLOUR MATRIX, MEASURED ON THIS SENSOR
# ------------------------------------------
# With no matrix the image is washed out: the sensor's colour filters overlap
# each other, so what it calls "red" carries a fair amount of green inside.
# Measured on the real scene before this, mean saturation was 6 out of 255.
#
# HOW IT WAS MEASURED (camera/measure-color-matrix)
# The monitor is painted a flat colour full screen, the phone looks at it, and
# the capture is taken raw. Twelve patches -- four neutral and eight coloured --
# with exposure and gain FIXED at 1600 and 800, chosen by measuring the
# brightest patch so it reaches 622 of 1023 without saturating a single pixel.
#
# Least squares then solves for the matrix taking the white-balanced sensor to
# linear sRGB, with each row forced to sum to 1 so grey stays grey.
#
# WHAT THIS MATRIX IS NOT: a monitor is not a colour target, and on top of that
# it emits with narrow LED primaries that look nothing like daylight. So it is
# calibrated for a screen's spectrum. It is a MEASURED matrix, not a laboratory
# one, and certainly better than none.
#
# CHECKS IT PASSED:
#   - each primary dominates its own channel (if not, the mosaic is being read
#     wrong)
#   - the sensor's response to light is linear: across the grey ramp the
#     sensor/light ratio varies by only 6% end to end
#   - applying the matrix to the patches themselves, the worst error is 0.026
#     out of 1.0, and most are between 0.003 and 0.011
%YAML 1.1
---
version: 1
algorithms:
  - BlackLevel:
      blackLevel: 4096
  - Awb:
  - Ccm:
      ccms:
        - ct: 6500
          ccm: [ 2.00441, -1.00382, -0.00059,
                -0.41255,  1.93934, -0.52679,
                -0.03423, -0.44489,  1.47912 ]
  - Adjust:
  - Agc:
...
