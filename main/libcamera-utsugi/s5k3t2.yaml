#
# Minimal libcamera tuning for the surya's front S5K3T2.
# Goes in /usr/share/libcamera/ipa/simple/s5k3t2.yaml
#
# The black level is the pedestal of 64 in 10 bits, which libcamera counts over
# 16 bits: 64 << 6 = 4096. It is the same one the s5k3l6xx in this directory
# uses, another Samsung of the same era.
#
# With no file of its own libcamera uses uncalibrated.yaml, which leaves the
# pedestal unsubtracted and gives a washed-out image with grey blacks.
%YAML 1.1
---
version: 1
algorithms:
  - BlackLevel:
      blackLevel: 4096
  - Awb:
  - Adjust:
  - Agc:
...
